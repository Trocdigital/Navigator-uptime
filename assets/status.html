<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigator Status</title>
<link rel="icon" href="https://navigator.trocdigital.io/static/icons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --border: #e9e6e0;
    --border-soft: #f0eee9;
    --text: #21201d;
    --text-muted: #85817a;
    --green: #1fa06a;
    --yellow: #d9a514;
    --orange: #d97917;
    --red: #d2483e;
    --gray: #e4e1db;
    --link: #21201d;
    --banner-ok: #1fa06a;
    --banner-warn: #d97917;
    --banner-down: #d2483e;
    --tip-bg: #21201d;
    --tip-text: #faf9f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1915;
      --card: #21201c;
      --border: #35332d;
      --border-soft: #2b2925;
      --text: #edeae4;
      --text-muted: #8f8b83;
      --green: #35b57e;
      --yellow: #d9a514;
      --orange: #e08a2e;
      --red: #e0655c;
      --gray: #3a3831;
      --link: #edeae4;
      --banner-ok: #1e8f60;
      --banner-warn: #c46f16;
      --banner-down: #bf4238;
      --tip-bg: #edeae4;
      --tip-text: #1a1915;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 72px; }

  header { display: flex; align-items: center; gap: 10px; padding: 44px 0 36px; }
  header img { width: 24px; height: 24px; border-radius: 5px; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  header .divider { color: var(--border); font-weight: 400; }
  header .sub { font-size: 15px; font-weight: 400; color: var(--text-muted); }

  .banner {
    border-radius: 10px; padding: 15px 18px; color: #fff;
    font-size: 15px; font-weight: 600; letter-spacing: -.005em;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .banner svg { flex: none; width: 18px; height: 18px; }
  .banner.ok { background: var(--banner-ok); }
  .banner.warn { background: var(--banner-warn); }
  .banner.down { background: var(--banner-down); }
  .banner.loading { background: var(--card); color: var(--text-muted); border: 1px solid var(--border); font-weight: 400; }

  #incidents { margin-bottom: 28px; }
  .incident {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 10px;
  }
  .incident-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sev-badge {
    flex: none; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; padding: 2px 8px; border-radius: 99px;
    color: #fff; background: var(--red); align-self: center;
  }
  .incident.minor .sev-badge { background: var(--yellow); }
  .incident a { color: var(--link); text-decoration: none; font-weight: 600; font-size: 14px; }
  .incident a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .incident .detail { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .updates { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
  .update { position: relative; padding-left: 16px; margin-bottom: 12px; }
  .update:last-child { margin-bottom: 0; }
  .update::before {
    content: ""; position: absolute; left: 2px; top: 7px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted);
  }
  .update .update-meta { font-size: 11px; font-weight: 500; color: var(--text-muted); }
  .update .update-body { margin-top: 1px; white-space: pre-wrap; font-size: 13px; }

  section { margin-bottom: 28px; }
  .group-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .1em; color: var(--text-muted);
    padding: 0 2px 10px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .group-title .g-state { letter-spacing: .02em; text-transform: none; font-size: 12px; }
  .group {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .component { padding: 16px 18px; border-bottom: 1px solid var(--border-soft); }
  .component:last-child { border-bottom: none; }
  .component-row { display: flex; align-items: baseline; gap: 10px; }
  .component-name { font-weight: 500; font-size: 14px; letter-spacing: -.005em; min-width: 0; }
  .component-name a { color: inherit; text-decoration: none; }
  .component-name a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .component-meta { font-size: 12px; color: var(--text-muted); flex: none; }
  .component-status { margin-left: auto; font-size: 12.5px; font-weight: 500; flex: none; }
  .st-up { color: var(--green); }
  .st-degraded { color: var(--orange); }
  .st-down { color: var(--red); }

  .bars { display: flex; gap: 3px; margin-top: 12px; height: 30px; }
  .bars span {
    flex: 1; border-radius: 2px; background: var(--green);
    position: relative; cursor: default;
  }
  .bars span:hover { filter: brightness(1.15); }
  .bars span.b-yellow { background: var(--yellow); }
  .bars span.b-orange { background: var(--orange); }
  .bars span.b-red { background: var(--red); }
  .bars span.b-empty { background: var(--gray); }
  .bars span:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: 37px; left: 50%; transform: translateX(-50%);
    background: var(--tip-bg); color: var(--tip-text);
    padding: 5px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 500; letter-spacing: 0; white-space: nowrap;
    z-index: 10; pointer-events: none;
  }
  @media (max-width: 560px) {
    .bars span:nth-child(-n+45) { display: none; }  /* on small screens show the last 45 days */
  }
  .bars-legend {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 11px; font-weight: 500; color: var(--text-muted);
  }

  footer {
    margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="https://navigator.trocdigital.io/static/icons/favicon.ico" alt="">
    <h1>Navigator</h1>
    <span class="divider">/</span>
    <span class="sub">Status</span>
  </header>

  <div id="banner" class="banner loading">Checking service status…</div>
  <div id="incidents"></div>
  <div id="groups"></div>

  <footer>
    <span>Updated <span id="updated" class="num">—</span> · refreshes every 5 minutes</span>
    <span>Powered by <a href="https://github.com/Trocdigital/Navigator-uptime" target="_blank" rel="noopener">Upptime</a></span>
  </footer>
</div>

<script>
const REPO = "Trocdigital/Navigator-uptime";
const SUMMARY_URL = `https://raw.githubusercontent.com/${REPO}/master/history/summary.json`;
// Only open issues: active incidents disappear from the page as soon as they are resolved
const ISSUES_URL = `https://api.github.com/repos/${REPO}/issues?labels=status&state=open&per_page=20&sort=created&direction=desc`;
const DAYS = 90;

// Component grouping by slug. Any slug not listed falls into "Other Services".
const GROUPS = [
  { title: "Navigator", slugs: [
    "navigator", "navigator-api", "navigator-api-ai",
    "navigator-frontend-service", "navigator-monitoring",
    "data-integrator-api-production-scheduler",
  ]},
  { title: "Ticket Systems", slugs: [
    "ticket-system-zammad-trocglobal", "ticket-system-zammad-pokemon-trocglobal", "zammad-apple",
  ]},
  { title: "ERP & CRM", slugs: [
    "troc-erp-odoo", "odoo-employee-hub", "odoo-roadshow",
    "crm-att-odoo", "epson-events-odoo", "ticket-system-odoo-polestar-crm",
  ]},
  { title: "Other Services", slugs: [] },
];

const STATUS_LABEL = { up: "Operational", degraded: "Degraded", down: "Down" };

const ICONS = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8.5 12.5 2.5 2.5 4.5-5.5"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.5" r=".5" fill="currentColor"/></svg>',
};

function dayKey(d) { return d.toISOString().slice(0, 10); }

function lastNDays(n) {
  const out = [];
  const today = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setUTCDate(d.getUTCDate() - i);
    out.push(dayKey(d));
  }
  return out;
}

function barClass(minutes) {
  if (minutes === 0) return "";
  if (minutes < 30) return "b-yellow";
  if (minutes < 240) return "b-orange";
  return "b-red";
}

function fmtDate(iso, opts) {
  return new Date(iso).toLocaleDateString("en-US", opts || { day: "numeric", month: "short", year: "numeric" });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderSite(site) {
  const days = lastNDays(DAYS);
  const downMap = site.dailyMinutesDown || {};
  let totalDown = 0;
  const bars = days.map(day => {
    const min = downMap[day] || 0;
    totalDown += min;
    const tip = `${fmtDate(day + "T00:00:00Z", { day: "numeric", month: "short" })} · ` +
      (min === 0 ? "no incidents" : `${min} min down`);
    return `<span class="${barClass(min)}" data-tip="${tip}"></span>`;
  }).join("");
  const uptime90 = (100 * (1 - totalDown / (DAYS * 1440))).toFixed(2);
  const st = site.status || "up";
  return `
    <div class="component">
      <div class="component-row">
        <span class="component-name"><a href="./history/${site.slug}">${escapeHtml(site.name)}</a></span>
        <span class="component-meta num">${site.time} ms</span>
        <span class="component-status st-${st}">${STATUS_LABEL[st] || st}</span>
      </div>
      <div class="bars">${bars}</div>
      <div class="bars-legend">
        <span>${DAYS} days ago</span><span class="num">${uptime90}% uptime</span><span>Today</span>
      </div>
    </div>`;
}

function renderGroups(sites) {
  const assigned = new Set(GROUPS.flatMap(g => g.slugs));
  const bySlug = Object.fromEntries(sites.map(s => [s.slug, s]));
  document.getElementById("groups").innerHTML = GROUPS.map(g => {
    const members = g.slugs.length
      ? g.slugs.map(s => bySlug[s]).filter(Boolean)
      : sites.filter(s => !assigned.has(s.slug));
    if (!members.length) return "";
    const groupDown = members.some(s => s.status === "down");
    const groupDegraded = members.some(s => s.status === "degraded");
    const gl = groupDown ? ["st-down", "Outage"] : groupDegraded ? ["st-degraded", "Degraded"] : ["st-up", "Operational"];
    return `
      <section>
        <div class="group-title"><span>${g.title}</span><span class="g-state ${gl[0]}">${gl[1]}</span></div>
        <div class="group">${members.map(renderSite).join("")}</div>
      </section>`;
  }).join("");
}

function renderBanner(sites) {
  const banner = document.getElementById("banner");
  const down = sites.filter(s => s.status === "down");
  const degraded = sites.filter(s => s.status === "degraded");
  banner.classList.remove("loading", "ok", "warn", "down");
  if (down.length) {
    banner.classList.add("down");
    banner.innerHTML = `${ICONS.alert} Ongoing outage: ${down.map(s => escapeHtml(s.name)).join(", ")}`;
  } else if (degraded.length) {
    banner.classList.add("warn");
    banner.innerHTML = `${ICONS.alert} Degraded performance: ${degraded.map(s => escapeHtml(s.name)).join(", ")}`;
  } else {
    banner.classList.add("ok");
    banner.innerHTML = `${ICONS.ok} All systems operational`;
  }
}

// Comment cache per issue: only re-fetched when the issue's comment count changes,
// to stay well under GitHub's 60 unauthenticated requests/hour limit.
const commentsCache = new Map();
const MAX_COMMENT_FETCHES = 8;

async function getUpdates(incidents) {
  const withComments = incidents.filter(i => i.comments > 0).slice(0, MAX_COMMENT_FETCHES);
  await Promise.all(withComments.map(async i => {
    const cached = commentsCache.get(i.number);
    if (cached && cached.count === i.comments) return;
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/issues/${i.number}/comments?per_page=20`);
      if (res.ok) commentsCache.set(i.number, { count: i.comments, list: await res.json() });
    } catch (e) { /* updates are optional; never break the page */ }
  }));
}

function renderUpdates(issue) {
  const cached = commentsCache.get(issue.number);
  if (!cached || !cached.list.length) return "";
  const items = [...cached.list].reverse().map(c => `
    <div class="update">
      <div class="update-meta">${escapeHtml(c.user.login)} · ${fmtDate(c.created_at, { day: "numeric", month: "short" })}, ${new Date(c.created_at).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" })}</div>
      <div class="update-body">${escapeHtml(c.body)}</div>
    </div>`).join("");
  return `<div class="updates">${items}</div>`;
}

function fmtAgo(ms) {
  const min = Math.round(ms / 60000);
  if (min < 60) return `${min} min ago`;
  const h = Math.floor(min / 60);
  return h < 48 ? `${h} h ${min % 60} min ago` : `${Math.round(h / 24)} days ago`;
}

async function renderIncidents(issues) {
  const el = document.getElementById("incidents");
  const incidents = issues.filter(i => !i.pull_request);
  if (!incidents.length) { el.innerHTML = ""; return; }
  await getUpdates(incidents);
  el.innerHTML = incidents.map(i => {
    const labels = (i.labels || []).map(l => l.name);
    const minor = labels.includes("minor") && !labels.includes("major");
    return `
    <div class="incident${minor ? " minor" : ""}">
      <div class="incident-head">
        <span class="sev-badge">${minor ? "Minor" : "Major"}</span>
        <a href="${i.html_url}" target="_blank" rel="noopener">${escapeHtml(i.title)}</a>
        <span class="detail">Started ${fmtAgo(Date.now() - new Date(i.created_at))}</span>
      </div>
      ${renderUpdates(i)}
    </div>`;
  }).join("");
}

async function load() {
  try {
    const bust = Math.floor(Date.now() / 300000); // same value for 5 min so the CDN cache is reused
    const [summaryRes, issuesRes] = await Promise.all([
      fetch(`${SUMMARY_URL}?v=${bust}`),
      fetch(ISSUES_URL),
    ]);
    if (!summaryRes.ok) throw new Error(`summary.json HTTP ${summaryRes.status}`);
    const sites = await summaryRes.json();
    renderBanner(sites);
    renderGroups(sites);
    // Active incidents are secondary: a GitHub API rate limit must not break the page
    if (issuesRes.ok) await renderIncidents(await issuesRes.json());
    document.getElementById("updated").textContent =
      new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    const banner = document.getElementById("banner");
    banner.classList.remove("loading", "ok", "warn");
    banner.classList.add("down");
    banner.textContent = "Could not load status: " + e.message;
  }
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
